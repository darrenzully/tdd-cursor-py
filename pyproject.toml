[project]
name = "tdd-cursor-python"
version = "0.1.0"
description = "Proyecto TDD en Python con Cursor"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pytest>=8.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/domain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"
